<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Object preview</title>
    <link rel="stylesheet" href="../../sdk/1/panel.css" />
    <style>
      .object-title { font-weight: 600; }
      .object-field {
        font-size: 11px; word-break: break-all;
        color: rgb(var(--ss-ink, 40 33 24) / 0.7);
      }
      .object-image { max-width: 100%; max-height: 320px; border-radius: 6px; margin-top: 6px; }
      .object-metadata {
        margin: 0; max-height: 260px; overflow: auto; padding: 8px; border-radius: 6px;
        background: rgb(var(--ss-ink, 40 33 24) / 0.05);
        font: 11px/1.5 ui-monospace, Menlo, monospace;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="../../sdk/1/scistudio-panel.js"></script>
    <script type="module" src="panel.js"></script>
  </body>
</html>
