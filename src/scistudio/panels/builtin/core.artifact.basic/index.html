<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Artifact preview</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        font: 12px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
        color: rgb(var(--ss-ink, 40 33 24));
        background: rgb(var(--ss-surface, 255 255 255));
      }
      .wrap { padding: 8px; }
      .card { display: flex; flex-direction: column; gap: 6px; padding: 12px; border: 1px solid rgb(var(--ss-ink, 40 33 24) / 0.1); border-radius: 8px; background: rgb(var(--ss-surface, 255 255 255)); }
      .name { font-weight: 600; }
      .field { font-size: 11px; color: rgb(var(--ss-ink, 40 33 24) / 0.7); word-break: break-all; }
      img { max-width: 100%; max-height: 320px; border-radius: 6px; margin-top: 6px; }
      a.download { font-size: 12px; }
      .err { color: #b3261e; padding: 8px; }
    </style>
  </head>
  <body>
    <div class="wrap"><div id="root"></div></div>
    <script src="../../sdk/1/scistudio-panel.js"></script>
    <script src="panel.js"></script>
  </body>
</html>
