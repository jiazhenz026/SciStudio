<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Artifact &mdash; SciStudio panel</title>
<!--
  ADR-054 spec 1, T-009 (#2229) — the built-in Artifact panel.

  Replaces the ArtifactViewer in
  frontend/src/components/DataPreview.parts/coreViewers.tsx. Renders the
  `core.artifact.basic` provider's ARTIFACT envelope: the storage path, the MIME
  type, the size, an inline preview when the provider inlined a small image, and
  the download action.

  FR-034 / A-004: strictly self-contained. Markup, styles and script in one
  file — no <script src>, no <link rel=stylesheet>, no shared runtime import, no
  CDN. Its envelope plumbing and colour tokens repeat the other built-in
  panels' on purpose.

  Outbound: a *displaying* panel emits nothing (ADR-054 3.6). Downloading leaves
  as `host_action` with the action "download" (D-017): the frame is granted
  `allow-scripts` and nothing else, so it has no `allow-downloads` and saving a
  file is host chrome. The host answers `host_action_result`.
-->
<style>
  :root {
    --ink: #1c211b;
    --ember: #f06a44;
    --amber-border: #fcd34d;
    --amber-bg: #fffbeb;
    --amber-text: #92400e;
    --danger: #b3261e;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    color: var(--ink);
    font: 12px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  body { padding: 8px; }
  .stack { display: flex; flex-direction: column; gap: 8px; }
  .card {
    display: flex;
    flex-direction: column;
    gap: 6px;
    border: 1px solid rgba(28, 33, 27, 0.1);
    border-radius: 1rem;
    background: #fff;
    padding: 16px;
    font-size: 12px;
    color: rgba(28, 33, 27, 0.7);
  }
  .card .title { font-weight: 500; color: var(--ink); }
  .card .path { word-break: break-all; font-size: 11px; }
  .card .meta { font-size: 11px; }
  .card img { margin-top: 8px; max-height: 288px; border-radius: 6px; align-self: flex-start; }
  .actions { display: flex; align-items: center; gap: 8px; }
  button {
    font: inherit;
    color: inherit;
    background: #fff;
    border: 1px solid rgba(28, 33, 27, 0.2);
    border-radius: 6px;
    padding: 3px 10px;
    cursor: pointer;
  }
  button:hover { border-color: var(--ember); }
  .banner {
    border: 1px solid var(--amber-border);
    background: var(--amber-bg);
    color: var(--amber-text);
    border-radius: 1rem;
    padding: 8px 12px;
    font-size: 11px;
  }
  .banner p { margin: 0 0 4px; }
  .banner p:last-child { margin-bottom: 0; }
  .error {
    border: 1px solid rgba(179, 38, 30, 0.3);
    background: rgba(179, 38, 30, 0.08);
    color: var(--danger);
    border-radius: 1rem;
    padding: 12px;
  }
  .badges { display: flex; flex-wrap: wrap; gap: 4px; }
  .badge {
    border-radius: 999px;
    background: #fef3c7;
    color: var(--amber-text);
    padding: 1px 8px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .muted { color: rgba(28, 33, 27, 0.6); }
</style>
</head>
<body>
<div class="stack" id="root">
  <p class="muted">Waiting for the host&hellip;</p>
</div>

<script>
(function () {
  "use strict";

  /* ---------------------------------------------------------------------- */
  /* The D-011 envelope. Duplicated per FR-034; do not factor it out.        */
  /* ---------------------------------------------------------------------- */

  var PANEL_MESSAGE_MARKER = 1;
  var PANEL_API_VERSION = "1";

  var token = null;
  var context = null;
  var requestSeq = 0;
  var pending = Object.create(null);
  var torndown = false;

  function post(type, payload) {
    if (token === null || torndown) return false;
    try {
      window.parent.postMessage(
        { scistudio_panel: PANEL_MESSAGE_MARKER, token: token, type: type, payload: payload },
        "*"
      );
      return true;
    } catch (err) {
      return false;
    }
  }

  function reportError(message, detail) {
    post("error", { message: String(message), detail: detail || null });
  }

  /**
   * One bounded request/response round trip. The three outbound request types
   * differ in what they ask for, not in how they are answered (D-017): each
   * carries a request id, and the host answers with the matching `*_result` or
   * with an `error` carrying the same id (D-016), so a failed request ends here
   * rather than waiting out a timeout of its own.
   */
  function request(type, body) {
    return new Promise(function (resolve, reject) {
      requestSeq += 1;
      var id = "r" + requestSeq;
      pending[id] = { resolve: resolve, reject: reject };
      var payload = { request_id: id };
      Object.keys(body).forEach(function (key) { payload[key] = body[key]; });
      if (!post(type, payload)) {
        delete pending[id];
        reject(new Error("the host could not be reached"));
      }
    });
  }

  function settle(id, value) {
    var waiting = pending[id];
    if (!waiting) return false;
    delete pending[id];
    waiting.resolve(value);
    return true;
  }

  function failRequest(id, message) {
    var waiting = pending[id];
    if (!waiting) return false;
    delete pending[id];
    waiting.reject(new Error(message));
    return true;
  }

  /**
   * `host_action` — chrome the frame cannot perform for itself (D-017). It is
   * granted `allow-scripts` and nothing else, so it has neither
   * `allow-downloads` nor any reach into the application. The host does the
   * thing and answers `host_action_result`.
   */
  function hostAction(action, params) {
    return request("host_action", { action: action, params: params });
  }

  function envelopeOf(value) {
    var empty = { payload: {}, metadata: {}, resources: [], diagnostics: [], error: null };
    if (!value || typeof value !== "object") return empty;
    if (value.payload && typeof value.payload === "object") {
      return {
        payload: value.payload,
        metadata: value.metadata && typeof value.metadata === "object" ? value.metadata : {},
        resources: Array.isArray(value.resources) ? value.resources : [],
        diagnostics: Array.isArray(value.diagnostics) ? value.diagnostics : [],
        error: value.error && typeof value.error === "object" ? value.error : null
      };
    }
    return {
      payload: value,
      metadata: {},
      resources: [],
      diagnostics: [],
      error: value.error && typeof value.error === "object" ? value.error : null
    };
  }

  function asString(value, fallback) {
    return typeof value === "string" ? value : fallback === undefined ? "" : fallback;
  }

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined && text !== null) node.textContent = String(text);
    return node;
  }

  function badges(metadata) {
    var flags = [
      ["sampled", metadata.sampled],
      ["truncated", metadata.truncated],
      ["cached", metadata.cached],
      ["derived", metadata.derived],
      ["incomplete", metadata.complete === false]
    ];
    var active = flags.filter(function (entry) { return entry[1] === true; });
    if (active.length === 0) return null;
    var box = el("div", "badges");
    active.forEach(function (entry) { box.appendChild(el("span", "badge", entry[0])); });
    return box;
  }

  function diagnosticsBanner(diagnostics) {
    if (!diagnostics || diagnostics.length === 0) return null;
    var box = el("div", "banner");
    box.setAttribute("role", "status");
    diagnostics.forEach(function (line) { box.appendChild(el("p", null, line)); });
    return box;
  }

  function errorCard(error) {
    var box = el("div", "error");
    box.setAttribute("role", "alert");
    box.appendChild(el("p", null, "Artifact preview failed"));
    if (error && error.code) box.appendChild(el("p", "muted", String(error.code)));
    box.appendChild(el("p", null, error && error.message ? String(error.message) : "An unknown error occurred."));
    return box;
  }

  /* ---------------------------------------------------------------------- */
  /* The artifact                                                            */
  /* ---------------------------------------------------------------------- */

  var current = envelopeOf(null);

  function render() {
    var root = document.getElementById("root");
    root.textContent = "";

    if (current.error) {
      root.appendChild(errorCard(current.error));
      return;
    }

    var diag = diagnosticsBanner(current.diagnostics);
    if (diag) root.appendChild(diag);

    var payload = current.payload;
    var src = asString(payload.src);

    var card = el("div", "card");
    card.appendChild(el("p", "title", "Artifact"));
    card.appendChild(el("p", "path", asString(payload.path)));
    card.appendChild(el("p", "meta", asString(payload.mime_type, "application/octet-stream")));
    if (typeof payload.size_bytes === "number") {
      card.appendChild(el("p", "meta", payload.size_bytes + " bytes"));
    }

    // Only an inline `data:` image is shown. A remote URL is never loaded: the
    // provider inlines what is small enough and names a path for the rest, and
    // a panel document must not be the thing that fetches from the internet.
    if (src.indexOf("data:image/") === 0) {
      var img = document.createElement("img");
      img.setAttribute("alt", "Artifact preview");
      img.setAttribute("src", src);
      card.appendChild(img);
    }
    root.appendChild(card);

    var actions = el("div", "actions");
    var download = el("button", null, "Download");
    download.type = "button";
    download.setAttribute("aria-label", "Download this artifact");
    download.addEventListener("click", function () {
      hostAction("download", {
        path: payload.path !== undefined ? payload.path : null
      }).catch(function (err) {
        reportError("the artifact could not be downloaded: " + err.message, {
          path: payload.path || null
        });
      });
    });
    actions.appendChild(download);
    root.appendChild(actions);

    var chips = badges(current.metadata);
    if (chips) root.appendChild(chips);
  }

  /* ---------------------------------------------------------------------- */
  /* The handshake                                                           */
  /* ---------------------------------------------------------------------- */

  function onMessage(event) {
    var data = event.data;
    if (!data || typeof data !== "object") return;
    if (data.scistudio_panel !== PANEL_MESSAGE_MARKER) return;
    if (typeof data.type !== "string") return;
    var payload = data.payload && typeof data.payload === "object" ? data.payload : {};

    if (token === null) {
      if (data.type !== "init" || typeof data.token !== "string" || data.token === "") return;
      token = data.token;
      context = payload;
      current = envelopeOf(payload.target);
      post("ready", { api_version: PANEL_API_VERSION });
      render();
      return;
    }

    if (data.token !== token) return;

    switch (data.type) {
      case "update":
        if (payload.changed && typeof payload.changed === "object" && "target" in payload.changed) {
          current = envelopeOf(payload.changed.target);
          render();
        }
        break;
      case "host_action_result":
        if (payload.ok === false) {
          failRequest(payload.request_id, asString(payload.detail, "the host declined the action"));
        } else {
          settle(payload.request_id, payload.detail);
        }
        break;
      case "error": {
        var id = payload.request_id;
        if (typeof id === "string" && failRequest(id, asString(payload.message, "the request failed"))) {
          break;
        }
        current = {
          payload: current.payload,
          metadata: current.metadata,
          resources: current.resources,
          diagnostics: current.diagnostics,
          error: { code: asString(payload.code, "host_error"), message: asString(payload.message) }
        };
        render();
        break;
      }
      case "state_request":
        post("state", { state: null });
        break;
      case "teardown":
        torndown = true;
        window.removeEventListener("message", onMessage);
        break;
      default:
        break;
    }
  }

  window.addEventListener("message", onMessage);
})();
</script>
</body>
</html>
