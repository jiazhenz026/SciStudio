<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Plot preview</title>
    <link rel="stylesheet" href="../../sdk/1/panel.css" />
    <style>
      /* The figure takes the frame's height and scrolls inside it, so a zoomed-in
         figure stays reachable by panning rather than being clipped. A viewport
         cap was wrong here: `vh` measures the frame, so it left a fixed slice of
         the frame empty no matter how much room the host had given it. */
      .plot-surface {
        flex: 1; min-height: 12rem; overflow: auto; background: #fff; padding: 6px;
        border: 1px solid rgb(var(--ss-ink, 40 33 24) / 0.1); border-radius: 8px;
      }
      /* Scale from the top-left so the whole figure stays inside the scrollable
         extent; scaling from the centre pushes its top and left out of reach. */
      .plot-zoom-layer {
        transform-origin: top left; width: 100%; height: 100%;
        display: flex; align-items: flex-start; justify-content: center;
      }
      /* At 100% the figure fits the surface in both directions, which is what
         makes a focused tab worth opening; above 100% it overflows and the
         surface's own scrollbars pan over it. */
      .plot-image, .plot-zoom-layer canvas {
        display: block; max-width: 100%; max-height: 100%;
        width: auto; height: auto; object-fit: contain;
      }
      .plot-bar, .plot-pages { align-items: center; gap: 8px; flex-wrap: wrap; }
      .plot-format {
        text-transform: uppercase; letter-spacing: 0.08em; font-size: 11px;
        color: rgb(var(--ss-ink, 40 33 24) / 0.5);
      }
      .plot-zoom { display: inline-flex; align-items: center; gap: 4px; }
      .plot-zoom-level { min-width: 3.2em; text-align: center; font-variant-numeric: tabular-nums; }
      .plot-note { font-size: 11px; color: rgb(var(--ss-ink, 40 33 24) / 0.6); padding: 8px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="../../sdk/1/scistudio-panel.js"></script>
    <script type="module" src="panel.js"></script>
  </body>
</html>
