# Core tutorial 4 — "Two modalities, one answer" (scenarios doc, 关卡 3).
#
# The multimodal level, and the git level. Four breast tumors, each one an H&E
# image and a spatial expression table of the same slide, plus the region
# labels a pathologist assigned. Two are ER, two are triple-negative.
#
# The reader opens on the two ER tumors. The other two arrive later, when the
# subtype changes and the analysis has to branch: both recipes must stay
# runnable.
#
# **This is not a wiring lesson.** Tutorials 1 and 2 taught dragging, Browse
# and connecting. Here the reader spends the level changing a workflow, not
# building one.
manifest_version: 1
id: two-modalities-one-answer
title: Two modalities, one answer
summary: >-
  SciStudio is built for multimodal scientific data. Here you analyze two
  modalities of the same tumor at once — H&E tissue images and spatial gene
  expression — running the two streams in parallel through one workflow, and
  using git branches to keep more than one analysis alive.
order: 4

requires:
  # Same floor as the other levels: to_memory() and the ergonomic accessors
  # the shipped block sources rely on are stable from 0.3.1 (ADR-052 §10).
  scistudio: ">=0.3.1"
  agent: false
  packages: []

bootstrap:
  project_name: Two Modalities
  do:
    # Per tumor, an H&E image, the pathologist's region mask, and a
    # spot-by-gene expression table. See assets/data/er/SOURCE.md.
    #
    # Only the two ER tumors land here. The two triple-negative ones arrive
    # later, in the step that branches, so the opening can say "two" and mean
    # it.
    - copy:
        source: assets/data/er
        destination: data/raw
    # The project's own picture types, the reader that turns a slide file into
    # one, and the previewer that draws either of them. They land here rather
    # than arriving from My Library so the level owes nothing to any other
    # level.
    - write:
        source: assets/code/he_image.py
        destination: types/he_image.py
    - write:
        source: assets/code/he_mask.py
        destination: types/he_mask.py
    - write:
        source: assets/code/load_slide_image.py
        destination: blocks/load_slide_image.py
    - write:
        source: assets/code/image_preview.py
        destination: previewers/image_preview.py

steps:
  # 这一关的节奏跟关卡 1、2、3 一样：一句引导 + 一句指导，一步一件事，短句。
  #
  # **Three beats is the ceiling.** A step that wants a fourth is a step doing
  # two things.
  #
  # **Scene by default, chat line by exception.** `compact` is for the beats
  # that point at one small control — Run, a node, a plot card. A ring around a
  # whole surface (the config panel, the Data section, the canvas) keeps the
  # scene, because there the surface is the subject.
  #
  # **`auto_advance` where the reader's own action is the condition.**
  #
  # **With `auto_advance`, the last beat must be the instruction.** A payoff
  # written after it is never read: the step leaves the moment the reader
  # arrives on that beat with the condition already met. So every payoff opens
  # the *following* step instead.

  # ---------------------------------------------------------------- opening

  - id: two-instruments-one-question
    title: Two instruments, one tissue
    route_to: data
    # The ring arrives with the line that names the Data section, not before:
    # a highlight that precedes its sentence points at nothing yet.
    highlight:
      - ~
      - ~
      - data
      - data
    say:
      - "success: Good to see you! The lab just handed you today's spatial transcriptomics data to analyze."
      - "explain: Two H&E images of tumor tissue, the genes expressed across each slide, and a pathologist's mask of what is what."
      - "explain: They are waiting under **Data** — every file this project holds shows up there."
      - "curious: The question: how does gene expression in the cancer differ from the rest of the tissue?"

  # ------------------------------------------------------------ reading them

  - id: read-them-in
    title: Read them in
    auto_advance: true
    route_to: canvas
    compact: [false, true]
    highlight:
      - ~
      - run_button
    do:
      - write:
          source: assets/workflows/main.yaml
          destination: workflows/main.yaml
    say:
      - "explain: Let's see what the data looks like first. I've built you a workflow that reads it in."
      - "focus: **Press Run**."
    done_when:
      run_succeeded:
        since_step_entry: true

  - id: look-at-them
    title: Look at what came back
    auto_advance: true
    route_to: canvas
    compact: [false, true]
    highlight:
      - ~
      - node:
          block_type: load_data
    say:
      - "success: Read. The two slides, the regions a pathologist marked on them, and the two tables of counts."
      - "focus: **Click a Load** to see what it holds."
    done_when:
      ui_event:
        name: node_selected
        block_type: load_data
