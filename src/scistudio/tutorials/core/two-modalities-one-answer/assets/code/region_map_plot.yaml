# The region map in core tutorial 4, written for the reader together with its
# render script when the level reaches the picture.
#
# Bound to the joint block's `regions` output: one row per region with its
# section, centre and cluster. The plot draws that table back onto the slides;
# it computes nothing — the clustering happened in the block.
schema_version: 1
id: region_map
title: "The regions, back on the slides"
target:
  workflow_path: workflows/main.yaml
  workflow_id: main
  node_id: joint
  output_port: regions
  display_label: Joint Region Profiles
script:
  language: python
  path: render.py
