<!doctype html>
<!--
  The window the Review Labels block opens (core tutorial 2).

  This is the whole panel: panel.json, which says it is written for the
  interactive context, and this one hand-written page, with no framework and no
  build step. The host hands the page the JSON view the block's prepare_prompt
  built (window.scistudio.input) and takes the decision back through
  window.scistudio.writeBack({...}). Cancel is the host's: the window around
  this page offers it, and so does Escape.

  What it shows: one slide at a time. The micrograph is drawn underneath and the
  labels are washed over it in their own hues, so a reader asked to delete what
  is not a cell can see the cells; beside it, one row per label with its pixel
  area. Clicking a label in the picture or in the list marks it for removal on
  that slide.

  Continue walks to the next slide the reader has not looked at yet, and only
  once every slide has been seen does it send the decision. Closing on the
  first click would end the review with slides unexamined, which is exactly
  what a batch panel must not do. It sends { removed: [[ids], [ids], ...] }, one
  list per slide in the order they arrived, which is what run() reads.

  One window for the whole batch, not one window per slide. A reader who loaded
  several micrographs is making one decision about their experiment, and
  pausing the run again for every image would ask them the same question over
  and over. So the panel carries the batch and the run resumes once.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Review Labels</title>
    <link rel="stylesheet" href="../../sdk/1/panel.css" />
    <style>
      .review { display: flex; gap: 16px; align-items: flex-start; padding: 16px; }
      .review-left { flex: 0 0 auto; }
      .review-right { flex: 1 1 auto; min-width: 220px; }
      .review-title { font-weight: 600; margin-bottom: 8px; }
      .review-canvas { display: block; border-radius: 8px; cursor: crosshair; }
      .review-strip { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
      .review-position { flex: 1 1 auto; text-align: center; font-size: 13px; color: rgb(var(--ink) / 0.6); }
      .review-list { display: flex; flex-direction: column; gap: 4px; max-height: 360px; overflow: auto; }
      .review-row {
        display: flex; align-items: center; gap: 8px; padding: 4px 8px; cursor: pointer;
        border: 1px solid var(--line); border-radius: 6px;
      }
      .review-row:hover { background: rgb(var(--ink) / 0.05); }
      .review-row.gone { opacity: 0.45; text-decoration: line-through; }
      .review-swatch { width: 12px; height: 12px; border-radius: 3px; flex: 0 0 auto; }
      .review-name { flex: 1 1 auto; }
      .review-area { color: rgb(var(--ink) / 0.55); }
      .review-foot { margin-top: 12px; }
    </style>
  </head>
  <body>
    <div class="review">
      <div class="review-left">
        <div class="review-title">Click anything that is not a cell.</div>
        <canvas class="review-canvas" id="picture"></canvas>
        <!-- The slide strip. Present whatever the batch size, so a reader never
             has to work out whether there is more than one image in front of them. -->
        <div class="review-strip">
          <button class="panel-button" id="previous">‹ Previous</button>
          <div class="review-position" id="position"></div>
          <button class="panel-button" id="next">Next image ›</button>
        </div>
      </div>
      <div class="review-right">
        <div class="review-title" id="heading"></div>
        <div class="review-list" id="list"></div>
        <div class="review-foot">
          <button class="panel-button panel-button-primary" id="confirm">Continue</button>
        </div>
      </div>
    </div>
    <script src="../../sdk/1/scistudio-panel.js"></script>
    <script>
      const api = window.scistudio;

      /** How much of the label colour sits over the micrograph underneath. */
      const LABEL_ALPHA = 0.45;

      /**
       * How much smaller than the typical object a label has to be before the
       * panel points at it. A quarter of the median: cells vary, debris does not
       * come close. Compared against the median rather than the mean so a single
       * speck cannot drag the threshold down towards itself.
       */
      const SUSPECT_FRACTION = 0.25;

      /** A stable, distinct-enough colour for one label id. */
      function labelColor(id, removed) {
        const hue = (id * 137) % 360;
        return `hsl(${hue} 75% ${removed ? "28%" : "60%"})`;
      }

      /**
       * The labels worth a second look: far too small to be a cell.
       *
       * The panel says which ones it doubts rather than waiting for the reader
       * to find them. That is the difference between a review and a search: the
       * reader is being asked to confirm or reject a judgement, and a judgement
       * they cannot see is not one they can reject. Every label stays clickable;
       * the ring is a suggestion, never a filter.
       */
      function suspectLabels(labels) {
        const areas = labels.map((label) => label.area).sort((a, b) => a - b);
        if (areas.length < 2) return new Set();
        const middle = areas.length % 2
          ? areas[(areas.length - 1) / 2]
          : (areas[areas.length / 2 - 1] + areas[areas.length / 2]) / 2;
        const cutoff = middle * SUSPECT_FRACTION;
        return new Set(labels.filter((label) => label.area < cutoff).map((label) => label.id));
      }

      function drawGrid(canvas, grid, image, removed, suspects) {
        const rows = grid.length;
        const cols = rows ? grid[0].length : 0;
        if (!rows || !cols) return;
        const scale = Math.max(1, Math.floor(420 / Math.max(rows, cols)));
        canvas.width = cols * scale;
        canvas.height = rows * scale;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#111318";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // The micrograph first, in the green a fluorescence channel is shown in,
        // so the labels above it land on the cells they were found in.
        const hasImage = Array.isArray(image) && image.length === rows;
        if (hasImage) {
          for (let y = 0; y < rows; y += 1) {
            const row = image[y] || [];
            for (let x = 0; x < cols; x += 1) {
              const value = row[x] || 0;
              ctx.fillStyle = `rgb(${Math.round(value * 0.25)}, ${value}, ${Math.round(value * 0.45)})`;
              ctx.fillRect(x * scale, y * scale, scale, scale);
            }
          }
        }

        // Then the labels, translucent when there is a picture underneath to
        // keep visible, opaque when there is not.
        ctx.globalAlpha = hasImage ? LABEL_ALPHA : 1;
        for (let y = 0; y < rows; y += 1) {
          for (let x = 0; x < cols; x += 1) {
            const id = grid[y][x];
            if (!id) continue;
            ctx.fillStyle = labelColor(id, removed.has(id));
            ctx.fillRect(x * scale, y * scale, scale, scale);
          }
        }
        ctx.globalAlpha = 1;

        outlineSuspects(ctx, grid, suspects, removed, scale);
      }

      /**
       * Ring the labels the panel doubts, in red, until the reader has dealt with them.
       *
       * The ring is the ask: it marks what the panel thinks is not a cell so the
       * reader knows where to click. It goes away once that label is marked for
       * removal, because the question has been answered.
       *
       * Drawn as the bounding box of the label's pixels rather than traced
       * around its edge: the shape is visible underneath, and a box reads as a
       * mark *on* something rather than as another outline of it.
       */
      function outlineSuspects(ctx, grid, suspects, removed, scale) {
        const wanted = new Set([...suspects].filter((id) => !removed.has(id)));
        if (wanted.size === 0) return;
        const bounds = new Map();
        grid.forEach((row, y) =>
          row.forEach((id, x) => {
            if (!id || !wanted.has(id)) return;
            const box = bounds.get(id);
            if (!box) bounds.set(id, { top: y, left: x, bottom: y, right: x });
            else {
              box.top = Math.min(box.top, y);
              box.bottom = Math.max(box.bottom, y);
              box.left = Math.min(box.left, x);
              box.right = Math.max(box.right, x);
            }
          }),
        );
        ctx.strokeStyle = "#ef4444";
        ctx.lineWidth = 2;
        // Wide enough that the ring sits clear of a small object rather than on it.
        const pad = Math.max(4, scale);
        for (const box of bounds.values()) {
          ctx.strokeRect(
            box.left * scale - pad,
            box.top * scale - pad,
            (box.right - box.left + 1) * scale + 2 * pad,
            (box.bottom - box.top + 1) * scale + 2 * pad,
          );
        }
      }

      /**
       * Read the view as a list of slides. The single-slide shape is accepted
       * too, because a block that reviews one image is still an ordinary case and
       * a view written by hand says so.
       */
      function slidesOf(view) {
        if (Array.isArray(view.slides)) return view.slides;
        if (Array.isArray(view.grid)) return [view];
        return [];
      }

      function start() {
        const view = api.input && typeof api.input === "object" ? api.input : {};
        const slides = slidesOf(view).map((slide) => {
          const labels = Array.isArray(slide.labels) ? slide.labels : [];
          return {
            grid: Array.isArray(slide.grid) ? slide.grid : [],
            image: Array.isArray(slide.image) ? slide.image : null,
            labels,
            removed: new Set(),
            // Computed once: the areas do not change while the panel is open, so
            // neither does which of them the panel doubts.
            suspects: suspectLabels(labels),
          };
        });
        if (slides.length === 0) {
          slides.push({ grid: [], image: null, labels: [], removed: new Set(), suspects: new Set() });
        }
        let current = 0;
        // Which slides the reader has actually had in front of them. Continue
        // walks through what is left of this before it ends the review.
        const seen = new Set([0]);

        const canvas = document.getElementById("picture");
        const previous = document.getElementById("previous");
        const next = document.getElementById("next");
        const position = document.getElementById("position");
        const heading = document.getElementById("heading");
        const list = document.getElementById("list");
        const confirm = document.getElementById("confirm");

        const totalRemoved = () => slides.reduce((sum, slide) => sum + slide.removed.size, 0);

        /** The first slide the reader has not looked at, or null if none is left. */
        function nextUnseen() {
          for (let index = 0; index < slides.length; index += 1) {
            if (!seen.has(index)) return index;
          }
          return null;
        }

        /** Rebuild the label list for the slide on screen. */
        function fillList() {
          const slide = slides[current];
          list.replaceChildren();
          for (const label of slide.labels) {
            const gone = slide.removed.has(label.id);
            const row = document.createElement("div");
            row.className = gone ? "review-row gone" : "review-row";
            const swatch = document.createElement("i");
            swatch.className = "review-swatch";
            swatch.style.background = labelColor(label.id, gone);
            const name = document.createElement("span");
            name.className = "review-name";
            name.textContent = `label ${label.id}`;
            const area = document.createElement("span");
            area.className = "review-area";
            area.textContent = `${label.area} px`;
            row.append(swatch, name, area);
            row.addEventListener("click", () => toggle(label.id));
            list.appendChild(row);
          }
        }

        function refresh() {
          const slide = slides[current];
          drawGrid(canvas, slide.grid, slide.image, slide.removed, slide.suspects);
          heading.textContent = `${slide.labels.length} labels`;
          position.textContent = slides.length > 1 ? `Image ${current + 1} of ${slides.length}` : "One image";
          previous.disabled = current === 0;
          next.disabled = current === slides.length - 1;
          const count = totalRemoved();
          const left = slides.length - seen.size;
          // The button says which of its two jobs it is about to do. Ending the
          // review while a slide has never been on screen is the one outcome
          // this panel exists to prevent, so Continue walks there first and only
          // finishes once nothing is left unseen. It stays "Continue" while there
          // is more to see, because it is the same button doing the same job;
          // "Next image" would collide with the slide strip's own button.
          confirm.textContent = nextUnseen() === null
            ? (count ? `Continue (remove ${count})` : "Continue (keep all)")
            : `Continue (${left} image${left === 1 ? "" : "s"} left)`;
          fillList();
        }

        function toggle(id) {
          const { removed } = slides[current];
          if (removed.has(id)) removed.delete(id);
          else removed.add(id);
          refresh();
        }

        function show(index) {
          current = Math.min(Math.max(index, 0), slides.length - 1);
          seen.add(current);
          refresh();
        }

        previous.addEventListener("click", () => show(current - 1));
        next.addEventListener("click", () => show(current + 1));

        canvas.addEventListener("click", (event) => {
          const { grid } = slides[current];
          const rows = grid.length;
          const cols = rows ? grid[0].length : 0;
          if (!rows || !cols) return;
          const bounds = canvas.getBoundingClientRect();
          const x = Math.floor(((event.clientX - bounds.left) / bounds.width) * cols);
          const y = Math.floor(((event.clientY - bounds.top) / bounds.height) * rows);
          const row = grid[Math.min(y, rows - 1)];
          const id = row ? row[Math.min(x, cols - 1)] : 0;
          if (id) toggle(id);
        });

        confirm.addEventListener("click", () => {
          const pending = nextUnseen();
          if (pending !== null) {
            show(pending);
            return;
          }
          confirm.disabled = true;
          api
            .writeBack({ removed: slides.map((slide) => Array.from(slide.removed).sort((a, b) => a - b)) })
            .catch((error) => {
              confirm.disabled = false;
              api.reportError(String((error && error.message) || error));
            });
        });

        refresh();
      }

      api
        .ready()
        .then(start)
        .catch((error) => api.reportError(String((error && error.message) || error)));
    </script>
  </body>
</html>
