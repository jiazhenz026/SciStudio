# The workflow after the AI Block is added, in core tutorial 3's third act.
#
# `main.yaml` is the same graph with `ai-metadata` missing and `fit-curve`'s
# `metadata` input unconnected — which is how the reader finds out that the
# plate names groups and not doses: they run it, and the fit says so.
#
# What the AI Block adds is not a step in the pipeline so much as a fact the
# pipeline was missing. The concentrations exist only in the export's
# filename; no ordinary block reads a filename into data, and the fit cannot
# put anything on its x axis without them.
#
# Paths are project-relative on purpose: workflow runs execute in a worker
# whose working directory is the project root (engine/runners/local.py), so
# the same file works wherever the tutorial project lives.
workflow:
  id: main
  version: 1.0.0
  description: QC the plate, read the doses out of the filename, then fit the IC50.
  nodes:
    - id: load-plate
      block_type: load_data
      config:
        params:
          core_type: DataFrame
          path: data/raw/drug_A-J_1mM_500uM_200uM_100uM_50uM_20uM_10uM_5uM_2uM_1uM_plus_VEH_BLANK.csv
      layout:
        x: 80
        y: 180
    - id: qc-filter
      block_type: qc_outlier_filter
      config:
        params: {}
      layout:
        x: 380
        y: 100
    # The prompt is the block's real content, and the reader is asked to read
    # it before pressing Run. One line: a prompt long enough to need scrolling
    # is a prompt nobody checks, and the shape it asks for is exactly the shape
    # that comes back. A live AI Block puts this same line to a model.
    - id: ai-metadata
      block_type: tutorial_ai_agent
      config:
        params:
          user_prompt: >-
            Infer a metadata table from the filename. Table should look like
            this: group, concentration_um.
          provider: claude-code
          permission_mode: safe
      layout:
        x: 380
        y: 300
    - id: fit-curve
      block_type: fit_ic50
      config:
        params: {}
      layout:
        x: 700
        y: 180
    - id: save-summary
      block_type: save_data
      config:
        params:
          core_type: DataFrame
          path: data/processed
          filename: ic50_curve.csv
          overwrite: true
      layout:
        x: 1000
        y: 180
  edges:
    - source: load-plate:data
      target: qc-filter:table
    - source: load-plate:data
      target: ai-metadata:table
    - source: qc-filter:annotated
      target: fit-curve:table
    - source: ai-metadata:metadata
      target: fit-curve:metadata
    - source: fit-curve:curve
      target: save-summary:data
