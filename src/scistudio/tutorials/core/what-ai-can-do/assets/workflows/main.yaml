# The workflow the scripted agent assembles in core tutorial 3, beat 2:
# load -> QC outlier filter -> IC50 fit -> save. Written into the
# tutorial project's workflows/main.yaml by a replay segment, so the canvas
# gains these nodes at the moment the transcript claims them (FR-061b).
#
# Paths are project-relative on purpose: workflow runs execute in a worker
# whose working directory is the project root (engine/runners/local.py), so
# the same file works wherever the tutorial project lives.
workflow:
  id: main
  version: 1.0.0
  description: QC the plate, then fit the IC50 over the wells that survive.
  nodes:
    - id: load-plate
      block_type: load_data
      config:
        params:
          core_type: DataFrame
          path: data/raw/drug_A-J_1mM_500uM_200uM_100uM_50uM_20uM_10uM_5uM_2uM_1uM_plus_VEH_BLANK.csv
      layout:
        x: 80
        y: 180
    - id: qc-filter
      block_type: qc_outlier_filter
      config:
        params:
          sigma_threshold: 3
      layout:
        x: 380
        y: 180
    - id: fit-curve
      block_type: fit_ic50
      config:
        params: {}
      layout:
        x: 680
        y: 180
    - id: save-summary
      block_type: save_data
      config:
        params:
          core_type: DataFrame
          path: data/processed
          filename: ic50_curve.csv
          overwrite: true
      layout:
        x: 980
        y: 180
  edges:
    - source: load-plate:data
      target: qc-filter:table
    - source: qc-filter:annotated
      target: fit-curve:table
    - source: fit-curve:curve
      target: save-summary:data
