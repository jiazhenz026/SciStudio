# ADR-042 Addendum 6 §6 (revised by #2150): commit-time git hooks are REMOVED.
# `git commit` runs nothing. Every check that used to run at commit time now
# runs at the pre-PR stage through the single shared evaluator
# (`gate_record check --mode pre-pr`), which remains the hard local governance
# checkpoint alongside CI:
#
# - ruff / ruff-format and mypy run there as the evaluator's lint_format /
#   format_check / type_check checks (and in the standalone ci.yml jobs);
# - the hygiene hooks below run there as the evaluator's `commit_hygiene` check
#   (`pre-commit run --all-files --hook-stage manual`);
# - the final commit's Conventional Commits subject (previously the commitizen
#   commit-msg hook) is validated by the evaluator at pre-pr/ci;
# - the gate_record pre-commit/commit-msg reconciliation runs at pre-pr via the
#   same evaluator the hooks used to call;
# - the pytest suites (python_tests / architecture_tests) are untouched: they
#   run at pre-pr and in the ci.yml jobs exactly as before.
#
# All hooks in this file are bound to the `manual` stage, so even with the
# pre-commit framework shims installed nothing fires on `git commit`. Run them
# on demand with:
#
#   pre-commit run --all-files --hook-stage manual
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        stages: [manual]
      - id: end-of-file-fixer
        stages: [manual]
      - id: check-yaml
        stages: [manual]
      - id: check-json
        stages: [manual]
      - id: check-added-large-files
        args: ["--maxkb=1000"]
        stages: [manual]
      - id: check-merge-conflict
        stages: [manual]
      - id: detect-private-key
        stages: [manual]
