name: Desktop macOS DMG

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build"
        required: false
        default: "main"
      build_number:
        description: "Release build number to stamp (e.g. 11). Empty = committed dev build0000."
        required: false
        default: ""
      ota_channel:
        description: "OTA channel to enable (alpha|beta|stable). Empty = OTA disabled (dev build)."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: desktop-macos-dmg-${{ github.event.pull_request.number || github.event.inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-dmg:
    name: Build macOS DMG
    # arm64 (Apple Silicon) runner so the whole chain is arm64-consistent:
    # build:python:mac keys off `uname -m` and dist:dmg now targets --arm64
    # (#1747). An Intel runner here would bundle x64 Python in an arm64 shell.
    runs-on: macos-15
    # #2172: signing every Mach-O in the bundle and then waiting on Apple's
    # notarization queue both run silently for a long time, so a hang is
    # indistinguishable from slowness. Without a timeout GitHub's default of six
    # hours applies, and a stuck build burns a runner-day before anyone learns
    # anything. 90 minutes is well clear of a legitimately slow notarization
    # queue while still failing inside a release window.
    timeout-minutes: 90
    env:
      # #2096: signing is driven by whether the Developer ID certificate is
      # configured as a repository secret. With no certificate, identity
      # discovery stays off and this job produces the same unsigned dev artifact
      # it produced before, so a contributor without release credentials is
      # unaffected. With the certificate present, electron-builder signs with it
      # and (given the APPLE_API_* secrets below) notarizes and staples.
      #
      # The `secrets` context is NOT available in a step-level `if:` -- GitHub
      # rejects the whole workflow with "Unrecognized named-value: 'secrets'"
      # and the run never starts. It IS available in `jobs.<id>.env`, and the
      # `env` context IS available in `steps.<id>.if`, so secret *presence* is
      # mapped to these two flags here and the conditional steps test those.
      # Both are the strings "true"/"false", so compare against 'true'.
      HAS_MACOS_SIGNING: ${{ secrets.MACOS_CSC_LINK != '' }}
      HAS_NOTARY_KEY: ${{ secrets.APPLE_API_KEY_P8 != '' }}
      CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MACOS_CSC_LINK != '' }}
      CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      # #1908: For a release build, stamp the SSOT-derived version onto every
      # manifest before install so electron-builder names the DMG
      # SciStudio-<base>-<channel>-build<NNNN>. Empty build_number leaves the
      # committed dev build0000 in place. Runs before `npm ci` so package.json
      # and package-lock.json stay consistent for the install. Mirrors
      # desktop-linux-appimage.yml.
      - name: Stamp release version
        if: ${{ github.event.inputs.build_number != '' }}
        env:
          SCISTUDIO_BUILD_NUMBER: ${{ github.event.inputs.build_number }}
        run: python3 scripts/version.py sync

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        run: npm --prefix desktop ci

      - name: Build portable Python runtime
        # #2162: the runtime build asks the GitHub releases API which
        # python-build-standalone asset to fetch. Unauthenticated that call draws
        # on a rate limit shared by every Actions runner on the same egress IP,
        # which is how a macOS build failed 0.24s in with HTTP 403. The token is
        # only used for that query, never for the asset download.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm --prefix desktop run build:python:mac

      # #1908: An OTA channel enables launch-time update checks against that
      # channel's manifest (stage-resources.sh). Empty ota_channel keeps OTA
      # disabled, matching a local/dev build.
      - name: Stage resources
        env:
          SCISTUDIO_OTA_CHANNEL: ${{ github.event.inputs.ota_channel }}
        run: npm --prefix desktop run stage:sh

      # #2096: electron-builder reads the App Store Connect API key from a file
      # path in APPLE_API_KEY, so the secret has to land on disk first. Written
      # under RUNNER_TEMP with restrictive permissions and removed by the
      # cleanup step below, and passed through env rather than interpolated into
      # the script so the key never appears in a command line.
      - name: Write App Store Connect API key
        if: env.HAS_NOTARY_KEY == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/private_keys"
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/private_keys/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/private_keys/AuthKey.p8"

      - name: Build DMG
        env:
          APPLE_API_KEY: ${{ env.HAS_NOTARY_KEY == 'true' && format('{0}/private_keys/AuthKey.p8', runner.temp) || '' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # #2174: notarization is the one step that depends on a third party,
          # has no upper bound, and prints nothing while it waits. A 118-minute
          # hang left only the runner's own 'Terminate orphan process (notarytool)'
          # line to go on, which ruled out signing and nothing else. This surfaces
          # the submission ID and each polling state, so a cancelled build can
          # still be traced with `notarytool log <id>` afterwards.
          DEBUG: electron-notarize*,@electron/notarize*
        run: npm --prefix desktop run dist:dmg

      - name: Remove App Store Connect API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/private_keys"

      # #2096: electron-builder fails SOFT on notarization. macPackager's
      # notarizeIfProvided() logs "skipped macOS notarization" and returns when
      # the options cannot be generated, so a missing or typo'd credential
      # produces a green build and a dmg that still shows the Gatekeeper prompt.
      # Assert the outcome directly instead of trusting the build log.
      - name: Verify signature, hardened runtime and notarization
        if: env.HAS_MACOS_SIGNING == 'true'
        run: |
          set -euo pipefail
          APP=$(find desktop/dist -maxdepth 2 -name '*.app' -print -quit)
          test -n "$APP" || { echo "::error::no .app found under desktop/dist"; exit 1; }
          echo "verifying $APP"

          codesign --verify --deep --strict --verbose=2 "$APP"

          # Apple refuses to notarize without the hardened runtime, but assert
          # the flag directly so a package.json regression is caught here.
          codesign --display --verbose=2 "$APP" > "$RUNNER_TEMP/csinfo.txt" 2>&1
          grep -qE 'flags=.*runtime' "$RUNNER_TEMP/csinfo.txt" || {
            echo "::error::hardened runtime flag missing from the signature"
            cat "$RUNNER_TEMP/csinfo.txt"
            exit 1
          }

          # Gatekeeper's own verdict — the check that corresponds to a user
          # double-clicking the app.
          spctl -a -vvv -t exec "$APP"

          # A stapled ticket is the only proof notarization actually ran.
          xcrun stapler validate "$APP"

      - name: Verify DMG artifact exists
        run: |
          test -n "$(find desktop/dist -maxdepth 1 -name '*.dmg' -print -quit)"
          find desktop/dist -maxdepth 1 -type f -print

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: scistudio-macos-dmg
          path: desktop/dist/*.dmg
          if-no-files-found: error
